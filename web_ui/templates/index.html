<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼人杀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css?v=20261005d">
</head>
<body>

<!-- SVG Icon Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-wolf" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4.5 3.2 L9.4 6.6 L14.6 6.6 L19.5 3.2 L20.1 10.6 C20.1 15.9 16.7 19.7 12 21.6 C7.3 19.7 3.9 15.9 3.9 10.6 Z M8.9 10.9 a1.45 1.45 0 1 0 2.9 0 a1.45 1.45 0 1 0 -2.9 0 Z M12.2 10.9 a1.45 1.45 0 1 0 2.9 0 a1.45 1.45 0 1 0 -2.9 0 Z"/></symbol>
    <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
    <symbol id="icon-participate" viewBox="0 0 24 24"><path d="M16 11c1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3 1.3 3 3 3zM8 11c1.7 0 3-1.3 3-3S9.7 5 8 5 5 6.3 5 8s1.3 3 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 1.8 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h2v3h-2V2zm0 17h2v3h-2v-3zM4.2 4.2l2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4zm13.4 13.4 2.1 2.1-1.4 1.4-2.1-2.1 1.4-1.4zM2 12h3v2H2v-2zm17 0h3v2h-3v-2zM4.2 19.8l1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1zm13.4-13.4 1.4-1.4 2.1 2.1-1.4 1.4-2.1-2.1z"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M12.5 3c.5 0 1 .1 1.5.2A8 8 0 0 0 12 19 8 8 0 0 1 12.5 3z"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2z"/></symbol>
</svg>

<!-- Landing -->
<div id="landing" class="landing">
    <div class="brand-mark icon">
        <svg><use href="#icon-wolf"></use></svg>
    </div>
    <h1>狼人杀</h1>
    <p class="subtitle">九人局</p>
    <div class="mode-cards">
        <div class="mode-card card" data-mode="god" onclick="enterGodMode()">
            <div class="card-icon icon"><svg><use href="#icon-eye"></use></svg></div>
            <h2>上帝模式</h2>
            <p>观看 AI 对战，所有身份可见</p>
        </div>
        <div class="mode-card card" data-mode="player" onclick="showRoleSelect()">
            <div class="card-icon icon"><svg><use href="#icon-participate"></use></svg></div>
            <h2>玩家模式</h2>
            <p>选择身份，与 AI 同场竞技</p>
        </div>
    </div>
    <label class="rule-toggle card">
        <input type="checkbox" id="abstainToggle" checked>
        <span>规则：第 1 天允许弃票</span>
    </label>
</div>

<!-- Role Select -->
<div id="roleSelect" class="role-select" style="display:none">
    <h2>选择身份</h2>
    <div class="role-grid" id="roleGrid"></div>
    <button class="back-btn" onclick="goHome()">
        <span class="icon"><svg><use href="#icon-arrow-left"></use></svg></span>
        返回
    </button>
</div>

<!-- Game Board -->
<div id="game" class="game-board" style="display:none">
    <header class="game-header">
        <span class="mode-badge" id="modeBadge"></span>
        <span id="roundLabel">准备中</span>
        <span id="phaseLabel"></span>
        <span class="my-id" id="myId"></span>
        <nav class="game-nav">
            <button class="btn btn-text" onclick="goHome()">返回</button>
            <button class="btn btn-primary" id="startBtn" onclick="startGod()">开始</button>
            <button class="btn btn-primary" id="restartBtn" onclick="restartGame()" style="display:none">重来</button>
        </nav>
    </header>

    <section id="playerGrid" class="player-grid"></section>
    <section id="announceBar" class="announce-bar"></section>

    <section id="inputArea" class="input-area" style="display:none">
        <div id="turnIndicator" class="turn-indicator">
            <span class="icon"><svg><use href="#icon-chat"></use></svg></span>
            你的回合
        </div>
        <div id="actionHint" class="action-hint"></div>
        <div id="speechInput" style="display:none">
            <div class="field">
                <input type="text" id="speechBox" placeholder="输入发言" maxlength="500">
            </div>
            <button class="btn btn-primary" onclick="submitSpeech()">发送</button>
        </div>
        <div id="voteInput" style="display:none">
            <div id="voteButtons"></div>
        </div>
        <div id="actionInput" style="display:none">
            <div id="actionButtons"></div>
        </div>
    </section>

    <section id="wolfChannel" class="wolf-channel" style="display:none">
        <h3>
            <span class="icon"><svg><use href="#icon-wolf"></use></svg></span>
            狼人频道
        </h3>
        <div id="wolfLog" class="log"></div>
    </section>

    <div class="main-columns">
        <section id="dayArea" class="panel day-panel card">
            <h3>
                <span class="icon"><svg><use href="#icon-sun"></use></svg></span>
                白天
            </h3>
            <div id="dayLog" class="log"></div>
        </section>
        <section id="nightArea" class="panel night-panel card">
            <h3>
                <span class="icon"><svg><use href="#icon-moon"></use></svg></span>
                夜间
            </h3>
            <div id="nightLog" class="log"></div>
        </section>
    </div>
</div>

<script src="/static/game.js?v=20261005d"></script>
</body>
</html>
