    <link rel="stylesheet" href="/static/style.css?v=20261010a">

<!-- Landing -->
<div id="landing" class="landing">
    <div class="brand-mark icon">
        <svg><use href="#icon-wolf"></use></svg>
    </div>
    <h1>狼人杀</h1>
    <p class="subtitle">九人局</p>
    <div class="mode-cards">
        <div class="mode-card card" data-mode="god" onclick="enterGodMode()">
            <div class="card-icon icon"><svg><use href="#icon-eye"></use></svg></div>
            <h2>上帝模式</h2>
            <p>观看 AI 对战，所有身份可见</p>
        </div>
        <div class="mode-card card" data-mode="player" onclick="showRoleSelect()">
            <div class="card-icon icon"><svg><use href="#icon-participate"></use></svg></div>
            <h2>玩家模式</h2>
            <p>选择身份，与 AI 同场竞技</p>
        </div>
    </div>
    <label class="rule-toggle card">
        <input type="checkbox" id="abstainToggle" checked>
        <span>规则：第 1 天允许弃票</span>
    </label>
</div>

<!-- Role Select -->
<div id="roleSelect" class="role-select" style="display:none">
    <h2>选择身份</h2>
    <div class="role-grid" id="roleGrid"></div>
    <button class="back-btn" onclick="goHome()">
        <span class="icon"><svg><use href="#icon-arrow-left"></use></svg></span>
        返回
    </button>
</div>

<!-- Game Board -->
<div id="game" class="game-board" style="display:none">
    <header class="game-header">
        <span class="mode-badge" id="modeBadge"></span>
        <span id="roundLabel">准备中</span>
        <span id="phaseLabel"></span>
        <span class="my-id" id="myId"></span>
        <nav class="game-nav">
            <button class="btn btn-text" onclick="goHome()">返回</button>
            <button class="btn btn-primary" id="startBtn" onclick="startGod()">开始</button>
            <button class="btn btn-primary" id="restartBtn" onclick="restartGame()" style="display:none">重来</button>
        </nav>
    </header>

    <section id="playerGrid" class="player-grid"></section>
    <section id="announceBar" class="announce-bar"></section>

    <section id="inputArea" class="input-area" style="display:none">
        <div id="turnIndicator" class="turn-indicator">
            <span class="icon"><svg><use href="#icon-chat"></use></svg></span>
            你的回合
        </div>
        <div id="actionHint" class="action-hint"></div>
        <div id="speechInput" style="display:none">
            <div class="field">
                <input type="text" id="speechBox" placeholder="输入发言" maxlength="500">
            </div>
            <button class="btn btn-primary" onclick="submitSpeech()">发送</button>
        </div>
        <div id="voteInput" style="display:none">
            <div id="voteButtons"></div>
        </div>
        <div id="actionInput" style="display:none">
            <div id="actionButtons"></div>
        </div>
    </section>

    <section id="wolfChannel" class="wolf-channel" style="display:none">
        <h3>
            <span class="icon"><svg><use href="#icon-wolf"></use></svg></span>
            狼人频道
        </h3>
        <div id="wolfLog" class="log"></div>
    </section>

    <div class="main-columns">
        <section id="dayArea" class="panel day-panel card">
            <h3>
                <span class="icon"><svg><use href="#icon-sun"></use></svg></span>
                白天
            </h3>
            <div id="dayLog" class="log"></div>
        </section>
        <section id="nightArea" class="panel night-panel card">
            <h3>
                <span class="icon"><svg><use href="#icon-moon"></use></svg></span>
                夜间
            </h3>
            <div id="nightLog" class="log"></div>
        </section>
    </div>
</div>

<script src="/static/game.js?v=20261010a"></script>
</body>
</html>
